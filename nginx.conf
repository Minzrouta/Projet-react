server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Tout vient de la même origine : scripts, styles et appels /api.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # L'API est relayée par nginx : le navigateur ne parle qu'à une origine, sans CORS.
    location /api/ {
        proxy_pass ${API_URL};
        proxy_set_header Host $host;
        # appels de même origine pour le navigateur : sans cet en-tête, le CORS du backend
        # (ports 5101 à 5111 seulement) ne les rejette pas en 403
        proxy_set_header Origin "";
        # la simulation de latence du backend peut tenir une requête 60 s
        proxy_read_timeout 75s;
    }

    # fallback SPA : toutes les routes React renvoient index.html, toujours revalidé
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # fichiers au nom haché : jamais modifiés, donc cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
